// Picks the most recent agreement analysis that Agency 5 marked "Share with artist"
// in SoundClaim (stored on the artists row as publishing_agreements / deal_agreements).
function buildSharedCompass(a){
  const all=[...(Array.isArray(a.publishing_agreements)?a.publishing_agreements:[]),
             ...(Array.isArray(a.deal_agreements)?a.deal_agreements:[])];
  const shared=all.filter(x=>x&&x.compassStatus==='ready_to_share'&&x.compassAnalysis)
    .sort((x,y)=>String(y.compassAnalysedAt||'').localeCompare(String(x.compassAnalysedAt||'')));
  if(!shared.length) return {has:false,shared:false};
  const ag=shared[0], an=ag.compassAnalysis, kd=an.keyDates||{};
  const due=kd.autoRenewalNoticeDue||null;
  const daysLeft=due?Math.ceil((new Date(due)-new Date())/86400000):null;
  return {
    has:true,shared:true,
    name:(ag.publisher||ag.counterparty||'Agreement')+(ag.type?' — '+ag.type:''),
    score:an.artistProtectionScore??'—',
    assessment:an.overallAssessment||an.summary||'',
    redFlags:(an.redFlags||[]).length,amberFlags:(an.amberFlags||[]).length,
    autoRenewal:!!(kd.autoRenewal&&due&&daysLeft>=0),noticeDeadline:due,daysLeft,
    otherShared:shared.length-1,
  };
}

async function fetchArtistFromSupabase(artistId){
  const [
    {data:a},{data:cmos},{data:trackRows},{data:remits},
    {data:acts},{data:msgs},{data:activity},{data:cmoHist},{data:dspHist}
  ]=await Promise.all([
    SUPA.from('artists').select('*').eq('id',artistId).single(),
    SUPA.from('cmo_registrations').select('*').eq('artist_id',artistId),
    SUPA.from('tracks').select('*').eq('artist_id',artistId),
    SUPA.from('remittances').select('*').eq('artist_id',artistId).order('date',{ascending:false}),
    SUPA.from('portal_actions').select('*').eq('artist_id',artistId).eq('resolved',false).order('date',{ascending:false}),
    SUPA.from('portal_messages').select('*').eq('artist_id',artistId).order('sent_at',{ascending:false}),
    SUPA.from('artist_activity').select('*').eq('artist_id',artistId).order('event_date',{ascending:false}),
    SUPA.from('cmo_history').select('*').eq('artist_id',artistId),
    SUPA.from('dsp_history').select('*').eq('artist_id',artistId),
  ]);
  const cmo={};
  for(const r of (cmos||[])){
    cmo[r.cmo]={
      status:r.status,memberNum:r.member_num,lastCollection:r.last_collection,
      lastAmount:r.last_amount!=null?Number(r.last_amount):null,
      nextExpected:r.next_expected,stage:r.stage,
      stages:r.stage_labels?(typeof r.stage_labels==='string'?JSON.parse(r.stage_labels):r.stage_labels):undefined,
      note:r.notes,
    };
  }
  const cmoHistMap={};
  for(const row of (cmoHist||[])){
    if(!cmoHistMap[row.cmo]) cmoHistMap[row.cmo]={cmo:row.cmo,...(CMO_SCHED[row.cmo]||{}),nextExpected:cmo[row.cmo]?.nextExpected||'TBD',entries:[]};
    cmoHistMap[row.cmo].entries.push({period:row.period,gross:row.gross!=null?Number(row.gross):null,status:row.status,note:row.note});
  }
  const dspHistMap={};
  for(const row of (dspHist||[])){
    if(!dspHistMap[row.source]) dspHistMap[row.source]={source:row.source,type:row.income_type,schedule:row.schedule,scheduleNote:row.schedule_note,nextExpected:row.next_expected,note:row.note,entries:[]};
    dspHistMap[row.source].entries.push({period:row.period,gross:row.gross!=null?Number(row.gross):null,status:row.status,note:row.entry_note});
  }
  return {
    id:a.id,stageName:a.name,legalName:a.legal_name,initials:a.initials,color:a.brand_color,
    email:a.email,consultant:a.consultant,plan:a.plan,entity:a.entity,distributor:a.distributor||'—',
    cmo,
    tracks:(trackRows||[]).map(t=>({title:t.title,isrc:t.isrc,samro:t.samro,capasso:t.capasso,sampra:t.sampra,split:t.has_split})),
    financials:{
      collected:Number(a.collected)||0,pending:Number(a.pending)||0,nextDate:a.next_remit_date,
      remittances:(remits||[]).map(r=>({id:r.id,date:r.date,amount:Number(r.amount),source:r.source,status:r.status})),
      statements:[],
      cmoHistory:Object.values(cmoHistMap),
      dspHistory:Object.values(dspHistMap),
    },
    actions:(acts||[]).map(ac=>({id:ac.id,type:ac.action_type,title:ac.title,detail:ac.detail,urgency:ac.urgency,date:ac.date})),
    activity:(activity||[]).map(av=>({date:av.event_date,text:av.body,type:av.event_type})),
    compass:buildSharedCompass(a),splitSheets:[],
    messages:(msgs||[]).map(m=>({id:m.id,from:m.from_name,initials:m.initials,color:m.color,text:m.body,date:m.sent_at,fromConsultant:m.from_consultant})),
    _fromSupabase:true,
  };
}

const CMO_META={

  capasso:{label:'CAPASSO',color:T.capasso,desc:'Mechanical / publishing'},

function fmtR(n){if(!n&&n!==0)return'—';return'R '+n.toLocaleString('en-ZA',{minimumFractionDigits:0});}
function fmtDate(d){return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}
function statusColor(s){return{remitted:T.green,pending:T.amber,dispute:T.red,missing:T.red}[s]||T.sub;}
function statusBg(s){return{remitted:T.greenBg,pending:T.amberBg,dispute:T.redBg,missing:T.redBg}[s]||'rgba(255,255,255,0.05)';}
function statusLabel(s){return{remitted:'Done',pending:'Pending',dispute:'Dispute',missing:'Missing'}[s]||s;}
function ago(d){
  const days=Math.floor((new Date()-new Date(d))/(86400000));
  if(days===0)return'Today';if(days===1)return'Yesterday';
  if(days<7)return days+'d ago';if(days<30)return Math.floor(days/7)+'w ago';
  return Math.floor(days/30)+'mo ago';
}

function Pill({status,small}){
  const m={registered:{l:'Registered',c:T.green,bg:T.greenBg},in_progress:{l:'In progress',c:T.amber,bg:T.amberBg},not_registered:{l:'Not registered',c:T.sub,bg:'rgba(255,255,255,0.04)'},unknown:{l:'Unknown',c:T.sub,bg:'rgba(255,255,255,0.04)'}}[status]||{l:'Unknown',c:T.sub,bg:'rgba(255,255,255,0.04)'};
  const s=small?9:10,p=small?'1px 6px':'2px 8px';
  return <span style={{fontSize:s,fontWeight:600,padding:p,borderRadius:20,background:m.bg,color:m.c,textTransform:'uppercase',letterSpacing:'0.05em',border:`1px solid ${m.c}30`}}>{m.l}</span>;
}

function Icon({type}){

  return <div style={{width:24,height:24,borderRadius:'50%',background:`${col}18`,border:`1px solid ${col}30`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:col,fontSize:10}}>

function LoginScreen({onLogin}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  async function attempt(){
    if(!email.trim()||!pass.trim())return;
    setErr('');setLoading(true);
    const {data:authData}=await SUPA.auth.signInWithPassword({email:email.trim(),password:pass.trim()});
    if(authData?.session){
      try{
        const {data:pu}=await SUPA.from('artist_portal_users').select('artist_id').eq('user_id',authData.user.id).single();
        if(pu){const a=await fetchArtistFromSupabase(pu.artist_id);onLogin(a);return;}
      }catch(e){}
    }
    if(authData?.session){
      // Signed in, but this login isn't linked to an artist (e.g. an Agency 5 staff account)
      await SUPA.auth.signOut();
      setErr('This login is not linked to an artist profile. Contact Agency 5.');
    }else{
      setErr('Email or password not recognised.');
    }
    setLoading(false);
  }

  const inp={width:'100%',padding:'12px 14px',background:'rgba(255,255,255,0.05)',border:`1px solid ${T.bdrM}`,borderRadius:10,color:T.text,outline:'none',fontSize:14,fontFamily:'inherit',boxSizing:'border-box'};

  return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:T.bg,padding:24}}>
    <div className="fade-up" style={{width:'100%',maxWidth:380}}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{width:60,height:60,borderRadius:16,background:`linear-gradient(135deg,${T.accent},${T.accentD})`,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12,boxShadow:`0 8px 32px ${T.accentBg}`}}>
          <svg width="26" height="26" fill="none" stroke="#fff" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div style={{fontSize:22,fontWeight:700,color:T.text}}>Soundclaim</div>
        <div style={{fontSize:11,color:T.sub,letterSpacing:'0.14em',textTransform:'uppercase',marginTop:2}}>Artist Portal</div>
      </div>

      <div style={{background:T.surf,borderRadius:16,border:`1px solid ${T.bdr}`,padding:28,marginBottom:14}}>
        <div style={{fontSize:16,fontWeight:600,color:T.text,marginBottom:4}}>Sign in</div>
        <div style={{fontSize:13,color:T.sub,marginBottom:22}}>Your music. Your money. Your rights.</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,color:T.sub,marginBottom:5,fontWeight:500}}>Email address</div>
          <input style={inp} value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" onKeyDown={e=>e.key==='Enter'&&attempt()}/>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{fontSize:12,color:T.sub,marginBottom:5,fontWeight:500}}>Password</div>
          <div style={{position:'relative'}}>
            <input style={{...inp,paddingRight:52}} type={show?'text':'password'} value={pass} onChange={e=>setPass(e.target.value)} placeholder="Enter your password" onKeyDown={e=>e.key==='Enter'&&attempt()}/>
            <button onClick={()=>setShow(!show)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:T.sub,cursor:'pointer',fontSize:11,padding:4}}>{show?'Hide':'Show'}</button>
          </div>
        </div>
        {err&&<div style={{fontSize:12,color:T.red,background:T.redBg,padding:'8px 12px',borderRadius:8,marginBottom:12,textAlign:'center'}}>{err}</div>}
        <button onClick={attempt} disabled={loading||!email.trim()||!pass.trim()} style={{width:'100%',padding:13,borderRadius:10,border:'none',background:loading?T.faint:`linear-gradient(135deg,${T.accent},${T.accentD})`,color:loading?T.sub:'#fff',fontSize:14,fontWeight:600,cursor:loading?'default':'pointer',fontFamily:'inherit'}}>
          {loading?'Signing in...':'Sign in'}
        </button>
      </div>

      <div style={{textAlign:'center',marginTop:12,fontSize:11,color:T.faint}}>Agency Five Management (Pty) Ltd · Authorised personnel only</div>
    </div>
  </div>;
}

const SPLIT_ROLES=['Composer / Songwriter','Lyricist','Producer','Vocalist / Performer','Featured Artist','Beat Maker'];

function SplitSheetForm({artist,prefillTitle,onCancel,onSubmit}){
  const hasTracks=artist.tracks&&artist.tracks.length>0;
  const [isNewTrack,setIsNewTrack]=useState(!prefillTitle&&!hasTracks);
  const [trackTitle,setTrackTitle]=useState(prefillTitle||'');
  const [rows,setRows]=useState([
    {id:'c1',name:artist.stageName,role:'Composer / Songwriter',pub:'',master:'',ipi:'',contact:''},
    {id:'c2',name:'',role:'Producer',pub:'',master:'',ipi:'',contact:''},
  ]);

  function updateRow(id,field,val){setRows(prev=>prev.map(r=>r.id===id?{...r,[field]:val}:r));}
  function addRow(){setRows(prev=>[...prev,{id:'c'+Date.now(),name:'',role:'Composer / Songwriter',pub:'',master:'',ipi:'',contact:''}]);}
  function removeRow(id){setRows(prev=>prev.filter(r=>r.id!==id));}

  const totalPub=rows.reduce((s,r)=>s+(parseFloat(r.pub)||0),0);
  const totalMaster=rows.reduce((s,r)=>s+(parseFloat(r.master)||0),0);
  const pubOk=Math.round(totalPub)===100;
  const canSubmit=trackTitle.trim()&&rows.length>0&&rows.every(r=>r.name.trim());

  const inp={width:'100%',padding:'9px 10px',background:'rgba(255,255,255,0.05)',border:`1px solid ${T.bdrM}`,borderRadius:8,color:T.text,outline:'none',fontSize:12,fontFamily:'inherit',boxSizing:'border-box'};
  const sel={...inp,appearance:'none'};

  return <div style={{background:T.card,border:`1px solid ${T.bdrM}`,borderRadius:14,padding:16,marginBottom:18}}>
    <div style={{fontSize:14,fontWeight:600,color:T.text,marginBottom:2}}>New split sheet</div>
    <div style={{fontSize:11,color:T.sub,marginBottom:14,lineHeight:1.5}}>Fill this in while you're still in the studio — it goes straight to Agency 5 for review, signature chasing and CMO registration.</div>

    <div style={{marginBottom:14}}>
      <div style={{fontSize:11,color:T.sub,marginBottom:5,fontWeight:500}}>Track</div>
      {hasTracks&&!isNewTrack?
        <select style={sel} value={trackTitle} onChange={e=>{
          if(e.target.value==='__new__'){setIsNewTrack(true);setTrackTitle('');}
          else setTrackTitle(e.target.value);
        }}>
          <option value="">Select a track...</option>
          {artist.tracks.map(t=><option key={t.title} value={t.title}>{t.title}</option>)}
          <option value="__new__">+ New track (recording now)</option>
        </select>
        :
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <input style={inp} value={trackTitle} onChange={e=>setTrackTitle(e.target.value)} placeholder="Working title of the track"/>
          {hasTracks&&<button onClick={()=>setIsNewTrack(false)} style={{fontSize:11,color:T.accent,background:'none',border:'none',cursor:'pointer',whiteSpace:'nowrap'}}>Use existing</button>}
        </div>
      }
    </div>

    <div style={{fontSize:11,color:T.sub,marginBottom:8,fontWeight:500}}>Contributors</div>
    {rows.map((r,i)=><div key={r.id} style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:10,padding:12,marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <span style={{fontSize:11,fontWeight:600,color:T.sub}}>Contributor {i+1}</span>
        {rows.length>1&&<button onClick={()=>removeRow(r.id)} style={{fontSize:11,color:T.red,background:'none',border:'none',cursor:'pointer'}}>Remove</button>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
        <input style={inp} value={r.name} onChange={e=>updateRow(r.id,'name',e.target.value)} placeholder="Full name"/>
        <select style={sel} value={r.role} onChange={e=>updateRow(r.id,'role',e.target.value)}>
          {SPLIT_ROLES.map(role=><option key={role} value={role}>{role}</option>)}
        </select>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
        <div>
          <div style={{fontSize:10,color:T.sub,marginBottom:3}}>Publishing %</div>
          <input style={inp} type="number" min="0" max="100" value={r.pub} onChange={e=>updateRow(r.id,'pub',e.target.value)} placeholder="e.g. 25"/>
        </div>
        <div>
          <div style={{fontSize:10,color:T.sub,marginBottom:3}}>Master %</div>
          <input style={inp} type="number" min="0" max="100" value={r.master} onChange={e=>updateRow(r.id,'master',e.target.value)} placeholder="If applicable"/>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <input style={inp} value={r.ipi} onChange={e=>updateRow(r.id,'ipi',e.target.value)} placeholder="IPI / SAMRO no. (optional)"/>
        <input style={inp} value={r.contact} onChange={e=>updateRow(r.id,'contact',e.target.value)} placeholder="Phone or email"/>
      </div>
    </div>)}
    <button onClick={addRow} style={{width:'100%',padding:9,borderRadius:8,border:`1px dashed ${T.bdrM}`,background:'transparent',color:T.accent,fontSize:12,cursor:'pointer',fontFamily:'inherit',marginBottom:14}}>+ Add contributor</button>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',borderRadius:8,background:pubOk?T.greenBg:T.amberBg,marginBottom:14}}>
      <span style={{fontSize:11,color:pubOk?T.green:T.amber,fontWeight:600}}>Publishing split total</span>
      <span style={{fontSize:13,fontWeight:700,color:pubOk?T.green:T.amber,fontFamily:'DM Mono'}}>{totalPub}%{!pubOk?' — should total 100%':''}</span>
    </div>

    <div style={{display:'flex',gap:8}}>
      <button onClick={onCancel} style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${T.bdrM}`,background:'transparent',color:T.sub,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
      <button onClick={()=>canSubmit&&onSubmit({trackTitle:trackTitle.trim(),contributors:rows,totalPub,totalMaster})} disabled={!canSubmit} style={{flex:2,padding:12,borderRadius:10,border:'none',background:canSubmit?`linear-gradient(135deg,${T.accent},${T.accentD})`:'rgba(255,255,255,0.05)',color:canSubmit?'#fff':T.faint,fontSize:13,fontWeight:600,cursor:canSubmit?'pointer':'default',fontFamily:'inherit'}}>Send to Agency 5</button>
    </div>
  </div>;
}

function SplitSheetsScreen({artist,setArtist,prefillTitle,clearPrefill}){
  const [showForm,setShowForm]=useState(!!prefillTitle);

  useEffect(()=>{ if(prefillTitle) setShowForm(true); },[prefillTitle]);

  async function handleSubmit(data){
    const lines=(data.contributors||[]).map(c=>`• ${c.name} — ${c.role}: ${c.pub||0}% publishing / ${c.master||0}% master`).join('\n');
    const ok=await sendPortalMessage(artist,`SPLIT SHEET SUBMITTED — "${data.trackTitle}"\n${lines}\nTotals: ${data.totalPub}% publishing / ${data.totalMaster}% master`);
    if(!ok){alert('Split sheet could not be sent to Agency 5. Check your connection and try again.');return;}
    const entry={
      id:'sp'+Date.now(),
      trackTitle:data.trackTitle,
      contributors:data.contributors,
      totalPub:data.totalPub,
      totalMaster:data.totalMaster,
      status:'submitted',
      dateSubmitted:new Date().toISOString(),
    };
    setArtist(prev=>({
      ...prev,
      splitSheets:[entry,...(prev.splitSheets||[])],
      activity:[{date:new Date().toISOString(),text:`Split sheet submitted for "${data.trackTitle}" — sent to Agency 5 for review.`,type:'action'},...prev.activity],
    }));
    setShowForm(false);
    if(clearPrefill)clearPrefill();
  }

  function handleCancel(){
    setShowForm(false);
    if(clearPrefill)clearPrefill();
  }

  const sheets=artist.splitSheets||[];

  return <div style={{padding:'20px 16px 80px'}}>
    <div style={{marginBottom:14}}>
      <div style={{fontSize:20,fontWeight:700,color:T.text,marginBottom:4}}>Split Sheets</div>
      <div style={{fontSize:12,color:T.sub,lineHeight:1.5}}>Capture composition and master splits while you're still in the studio — much easier than reconstructing them later.</div>
    </div>

    {!showForm&&<button onClick={()=>setShowForm(true)} style={{width:'100%',padding:14,borderRadius:12,border:`1px dashed ${T.accentBdr}`,background:T.accentBg,color:T.accentL,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',marginBottom:18}}>+ Start a new split sheet</button>}

    {showForm&&<SplitSheetForm artist={artist} prefillTitle={prefillTitle} onCancel={handleCancel} onSubmit={handleSubmit}/>}

    <div style={{fontSize:13,fontWeight:600,color:T.text,marginBottom:10}}>Submitted split sheets</div>
    {sheets.length===0&&<div style={{fontSize:12,color:T.sub,padding:'4px 0 12px'}}>No split sheets submitted yet.</div>}
    {sheets.map(s=><div key={s.id} style={{background:T.card,border:`1px solid ${T.bdr}`,borderRadius:12,padding:'12px 14px',marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6,gap:8}}>
        <span style={{fontSize:13,fontWeight:600,color:T.text}}>{s.trackTitle}</span>
        <span style={{fontSize:9,fontWeight:600,padding:'2px 8px',borderRadius:20,background:T.amberBg,color:T.amber,textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>Pending review</span>
      </div>
      <div style={{fontSize:11,color:T.sub,marginBottom:6}}>{s.contributors.length} contributor{s.contributors.length!==1?'s':''} · {s.totalPub}% publishing logged · {ago(s.dateSubmitted)}</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
        {s.contributors.map((c,i)=><span key={i} style={{fontSize:10,color:T.sub,background:'rgba(255,255,255,0.04)',padding:'2px 8px',borderRadius:10}}>{c.name||'—'} · {c.pub||0}%</span>)}
      </div>
    </div>)}

    <div style={{padding:'12px 14px',background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:10,fontSize:11,color:T.sub,lineHeight:1.6,marginTop:14}}>
      Submissions here go to Agency 5 for verification — including checking IPI/SAMRO numbers and collecting signatures from all contributors — before splits are registered with SAMRO and CAPASSO.
    </div>
  </div>;
}

                <div style={{fontSize:10,color:T.sub}}>{c.schedule} · {c.scheduleNote}</div>
              </div>
            </div>
            <div style={{textAlign:'right'}}>
              {total>0&&<div style={{fontSize:13,fontWeight:600,color:T.text}}>{fmtR(total)}</div>}
              <div style={{fontSize:10,color:T.sub}}>Next: {c.nextExpected}</div>
            </div>
          </div>
          {c.entries.length===0?<div style={{fontSize:11,color:T.sub,fontStyle:'italic',padding:'6px 0'}}>No collections yet</div>:
            c.entries.map((e,i)=><div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderTop:`1px solid ${T.bdr}`}}>
              <div style={{fontSize:12,color:T.sub}}>{e.period}</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{fontSize:12,fontWeight:500,color:T.text}}>{e.gross?fmtR(e.gross):'—'}</div>
                <span style={{fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:20,color:statusColor(e.status),background:statusBg(e.status)}}>{statusLabel(e.status)}</span>
              </div>
            </div>)}
        </div>;
      })}
      <div style={{fontSize:15,fontWeight:600,color:T.text,marginBottom:12,marginTop:6}}>Distributor Income</div>
      {(f.dspHistory||[]).map((d,di)=>{
        const total=d.entries.reduce((s,e)=>s+(e.gross||0),0);
        const isCrbt=d.type==='crbt';
        return <div key={di} style={{background:T.card,border:`1px solid ${isCrbt?T.accentL+'30':T.bdr}`,borderRadius:12,padding:'14px 16px',marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <div style={{fontSize:13,fontWeight:600,color:T.text}}>{d.source}</div>
                {isCrbt&&<span style={{fontSize:9,fontWeight:700,padding:'1px 6px',borderRadius:20,background:T.accentBg,color:T.accentL}}>CRBT</span>}
              </div>
              <div style={{fontSize:10,color:T.sub,marginTop:1}}>{d.schedule} · {d.scheduleNote}</div>
            </div>
            <div style={{textAlign:'right'}}>
              {total>0&&<div style={{fontSize:13,fontWeight:600,color:T.text}}>{fmtR(total)}</div>}
              <div style={{fontSize:10,color:T.sub}}>Next: {d.nextExpected}</div>
            </div>
          </div>
          {d.note&&<div style={{fontSize:11,color:T.accentL,background:T.accentBg,padding:'6px 10px',borderRadius:7,marginBottom:8}}>{d.note}</div>}
          {d.entries.length===0?<div style={{fontSize:11,color:T.sub,fontStyle:'italic',padding:'6px 0'}}>No entries yet</div>:
            d.entries.map((e,i)=><div key={i} style={{borderTop:`1px solid ${T.bdr}`,padding:'7px 0'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:12,color:T.sub}}>{e.period}</div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:12,fontWeight:500,color:T.text}}>{e.gross?fmtR(e.gross):'—'}</div>
                  <span style={{fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:20,color:statusColor(e.status),background:statusBg(e.status)}}>{statusLabel(e.status)}</span>
                </div>
              </div>
              {e.note&&<div style={{fontSize:11,color:statusColor(e.status),marginTop:4}}>⚠ {e.note}</div>}
            </div>)}
        </div>;
      })}
    </div>}
    {sub==='remittances'&&<div style={{padding:'0 16px'}}>
      {f.remittances.map(r=><div key={r.id} style={{background:T.card,border:`1px solid ${T.bdr}`,borderRadius:12,padding:'14px 16px',marginBottom:8,display:'flex',alignItems:'center',gap:12}}>
        <div style={{width:36,height:36,borderRadius:10,background:T.greenBg,display:'flex',alignItems:'center',justifyContent:'center',color:T.green,fontSize:16,flexShrink:0}}>✓</div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:600,color:T.text}}>{fmtR(r.amount)}</div>
          <div style={{fontSize:11,color:T.sub,marginTop:1}}>{r.source}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:11,color:T.sub}}>{fmtDate(r.date)}</div>
          <span style={{fontSize:10,fontWeight:600,color:T.green,background:T.greenBg,padding:'1px 7px',borderRadius:20}}>Paid</span>
        </div>
      </div>)}
    </div>}
    {sub==='statements'&&<div style={{padding:'0 16px'}}>
      {f.statements.map(s=>{
        const flag=s.status.includes('flag')||s.status.includes('Missing');
        const ok=s.status==='Reviewed';
        return <div key={s.id} style={{background:T.card,border:`1px solid ${flag?T.red+'30':ok?T.bdr:T.amber+'30'}`,borderRadius:12,padding:'14px 16px',marginBottom:8}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
            <div>
              <div style={{fontSize:13,fontWeight:500,color:T.text}}>{s.source} — {s.period}</div>
              <div style={{fontSize:11,color:T.sub,marginTop:2}}>{s.type}</div>
            </div>
            <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:20,flexShrink:0,color:flag?T.red:ok?T.green:T.amber,background:flag?T.redBg:ok?T.greenBg:T.amberBg,whiteSpace:'nowrap'}}>{s.status}</span>
          </div>
          {s.flag&&<div style={{marginTop:8,fontSize:11,color:T.red,background:T.redBg,padding:'6px 10px',borderRadius:7}}>⚠ {s.flag}. Agency 5 is investigating.</div>}
        </div>;
      })}
      <div style={{padding:'10px 12px',background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:10,fontSize:11,color:T.sub,lineHeight:1.6,marginTop:4}}>
        For any questions about a specific statement, message your consultant directly.
      </div>
    </div>}
  </div>;
}

        <span style={{fontSize:9,fontWeight:700,color:a.urgency==='red'?T.red:T.amber,background:a.urgency==='red'?T.redBg:T.amberBg,padding:'2px 7px',borderRadius:20,height:'fit-content',textTransform:'uppercase',flexShrink:0}}>{a.urgency==='red'?'Urgent':'Action'}</span>
      </div>
      <div style={{fontSize:12,color:T.sub,lineHeight:1.6,marginBottom:10}}>{a.detail}</div>

}

function CompassScreen({artist}){
  const c=artist.compass;
  if(!c.has||!c.shared) return <div style={{padding:'20px 16px 80px',textAlign:'center'}}>
    <div style={{padding:'60px 20px',color:T.sub}}>
      <div style={{fontSize:40,marginBottom:12}}>◎</div>
      <div style={{fontSize:15,fontWeight:500,color:T.text,marginBottom:8}}>No analysis available yet</div>
      <div style={{fontSize:13,lineHeight:1.6}}>Agency 5 will analyse your agreements and share key insights here once reviewed.</div>
    </div>
  </div>;
  const scoreColor=c.score>=7?T.green:c.score>=4?T.amber:T.red;

  return <div style={{padding:'20px 16px 80px'}}>
    <div style={{marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>

        <div style={{fontSize:20,fontWeight:700,color:T.text}}>Contract Compass</div>
      </div>
      <div style={{fontSize:12,color:T.sub}}>Your agreements, explained by Agency 5</div>
    </div>
    <div style={{background:T.card,border:`1px solid ${T.accentBdr}`,borderRadius:14,padding:'18px',marginBottom:14}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12,gap:12}}>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:T.text,marginBottom:4}}>{c.name}</div>
          <div style={{fontSize:12,color:T.sub,lineHeight:1.5}}>{c.assessment}</div>
        </div>
        <div style={{textAlign:'center',flexShrink:0}}>
          <div style={{fontSize:28,fontWeight:700,color:scoreColor,fontFamily:'DM Mono',lineHeight:1}}>{c.score}</div>
          <div style={{fontSize:9,color:T.sub,textTransform:'uppercase',letterSpacing:'0.08em',marginTop:2}}>out of 10</div>
        </div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <span style={{fontSize:11,color:T.red,background:T.redBg,padding:'3px 10px',borderRadius:20,fontWeight:500}}>⚠ {c.redFlags} red flags</span>
        <span style={{fontSize:11,color:T.amber,background:T.amberBg,padding:'3px 10px',borderRadius:20,fontWeight:500}}>{c.amberFlags} to watch</span>
      </div>
    </div>
    {c.autoRenewal&&<div style={{background:T.amberBg,border:`1px solid ${T.amber}40`,borderRadius:12,padding:'14px 16px',marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:600,color:T.amber,marginBottom:6}}>⚠ Auto-renewal alert</div>
      <div style={{fontSize:12,color:T.sub,lineHeight:1.5,marginBottom:6}}>This agreement automatically renews unless written notice is given before {fmtDate(c.noticeDeadline)} — that is {c.daysLeft} days away.</div>
      <div style={{fontSize:11,color:T.amber,background:'rgba(240,168,64,0.08)',padding:'7px 10px',borderRadius:8}}>Agency 5 is monitoring this deadline and will contact you before the window closes.</div>
    </div>}
    <div style={{background:T.card,border:`1px solid ${T.bdr}`,borderRadius:12,padding:'14px 16px',marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:10}}>What does this mean for you?</div>
      {[
        {ico:'🔴',txt:'Your agreement has clauses that significantly favour the distributor. Agency 5 has flagged these and will use them in any future renegotiation.'},
        {ico:'📅',txt:'The auto-renewal clause is the most immediate concern. Agency 5 is tracking the deadline for you.'},
        {ico:'✅',txt:'You do not need to take any action right now. Agency 5 will advise you before any critical deadline.'},
      ].map((p,i)=><div key={i} style={{display:'flex',gap:10,padding:'8px 0',borderBottom:i<2?`1px solid ${T.bdr}`:'none'}}>
        <span style={{fontSize:16,flexShrink:0}}>{p.ico}</span>
        <span style={{fontSize:12,color:T.sub,lineHeight:1.5}}>{p.txt}</span>

    <div style={{padding:'10px 12px',background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:10,fontSize:10,color:T.faint,lineHeight:1.6}}>
      ⚖ This analysis is for educational purposes only and is not legal advice. It does not constitute legal representation. Consult a qualified entertainment attorney for advice specific to your situation.
    </div>
  </div>;
}

async function sendPortalMessage(artist,body){
  if(!artist._fromSupabase) return false;
  const {error}=await SUPA.from('portal_messages').insert({
    artist_id:artist.id,from_name:artist.stageName,initials:artist.initials,color:artist.color,
    body,from_consultant:false,sent_at:new Date().toISOString(),
  });
  if(error){console.error('portal_messages insert failed',error);return false;}
  return true;
}

function MessagesScreen({artist}){
  const [msgs,setMsgs]=useState(artist.messages);
  const [input,setInput]=useState('');
  const endRef=useRef(null);

  useEffect(()=>{
    if(endRef.current) endRef.current.scrollIntoView({behavior:'smooth'});
  },[msgs]);

  const [sendErr,setSendErr]=useState('');
  async function send(){
    const text=input.trim();
    if(!text)return;
    setSendErr('');
    const ok=await sendPortalMessage(artist,text);
    if(!ok){setSendErr('Message not sent. Check your connection and try again.');return;}
    setMsgs(prev=>[...prev,{id:'n'+Date.now(),from:artist.stageName,initials:artist.initials,color:artist.color,text,date:new Date().toISOString(),fromConsultant:false}]);
    setInput('');
  }

  return <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 56px)'}}>
    <div style={{padding:'14px 16px 12px',borderBottom:`1px solid ${T.bdr}`,flexShrink:0,display:'flex',alignItems:'center',gap:10}}>
      <div style={{width:36,height:36,borderRadius:10,background:'#C9951A',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff'}}>JL</div>
      <div>
        <div style={{fontSize:13,fontWeight:600,color:T.text}}>{artist.consultant}</div>
        <div style={{fontSize:11,color:T.green}}>● Agency 5</div>
      </div>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:'14px 16px'}}>
      {msgs.map(m=>{
        const isC=m.fromConsultant;
        return <div key={m.id} style={{display:'flex',gap:8,marginBottom:14,flexDirection:isC?'row':'row-reverse'}}>
          <Av initials={m.initials} color={m.color} size={30}/>
          <div style={{maxWidth:'78%'}}>
            <div style={{fontSize:10,color:T.sub,marginBottom:3,textAlign:isC?'left':'right'}}>{m.from} · {ago(m.date)}</div>
            <div style={{background:isC?T.card:`linear-gradient(135deg,${T.accent},${T.accentD})`,borderRadius:isC?'4px 12px 12px 12px':'12px 4px 12px 12px',padding:'10px 12px',fontSize:12,color:T.text,lineHeight:1.6,border:isC?`1px solid ${T.bdr}`:'none'}}>{m.text}</div>
          </div>
        </div>;
      })}
      <div ref={endRef}/>
      {sendErr&&<div style={{fontSize:11,color:T.red,background:T.redBg,padding:'6px 10px',borderRadius:8,textAlign:'center'}}>{sendErr}</div>}
    </div>
    <div style={{padding:'10px 12px',borderTop:`1px solid ${T.bdr}`,display:'flex',gap:8,flexShrink:0,background:T.surf,paddingBottom:16}}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Message Agency 5..." style={{flex:1,padding:'10px 14px',background:T.card,border:`1px solid ${T.bdrM}`,borderRadius:24,color:T.text,outline:'none',fontSize:13,fontFamily:'inherit'}}/>
      <button onClick={send} disabled={!input.trim()} style={{width:40,height:40,borderRadius:'50%',background:input.trim()?`linear-gradient(135deg,${T.accent},${T.accentD})`:'rgba(255,255,255,0.05)',border:'none',cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:16,color:input.trim()?'#fff':T.faint}}>➤</button>
    </div>
  </div>;
}

function ProfileScreen({artist,onLogout}){
  return <div style={{padding:'20px 16px 80px'}}>
    <div style={{background:`linear-gradient(135deg,${T.accent}18,${T.accentD}10)`,border:`1px solid ${T.accentBdr}`,borderRadius:16,padding:'20px',marginBottom:20,textAlign:'center'}}>
      <Av initials={artist.initials} color={artist.color} size={64}/>
      <div style={{fontSize:20,fontWeight:700,color:T.text,marginTop:10}}>{artist.stageName}</div>
      <div style={{fontSize:12,color:T.sub,marginTop:2}}>{artist.legalName}</div>
      <div style={{display:'inline-flex',gap:6,marginTop:10}}>
        <span style={{fontSize:11,fontWeight:600,color:T.accentL,background:T.accentBg,padding:'3px 10px',borderRadius:20,border:`1px solid ${T.accentBdr}`}}>{artist.plan} Plan</span>
        <span style={{fontSize:11,color:T.sub,background:'rgba(255,255,255,0.05)',padding:'3px 10px',borderRadius:20}}>Agency 5</span>
      </div>
    </div>
    {[{l:'Entity',v:artist.entity},{l:'Distributor',v:artist.distributor},{l:'Consultant',v:artist.consultant},{l:'Portal email',v:artist.email}].map(row=><div key={row.l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'13px 0',borderBottom:`1px solid ${T.bdr}`,fontSize:13}}>
      <span style={{color:T.sub}}>{row.l}</span>
      <span style={{color:T.text,textAlign:'right',maxWidth:'60%'}}>{row.v}</span>
    </div>)}
    <div style={{marginTop:20}}>
      {['My plan & commission','Need help?','Privacy & data','Contact Agency 5'].map(label=><div key={label} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 0',borderBottom:`1px solid ${T.bdr}`,cursor:'pointer'}}>
        <span style={{fontSize:13,color:T.text}}>{label}</span>
        <span style={{color:T.faint}}>›</span>
      </div>)}
    </div>
    <button onClick={onLogout} style={{width:'100%',marginTop:24,padding:13,borderRadius:10,border:`1px solid ${T.bdrM}`,background:'transparent',color:T.sub,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>Sign out</button>
    <div style={{textAlign:'center',marginTop:16,fontSize:10,color:T.faint,lineHeight:1.6}}>
      Soundclaim Artist Portal v1.1<br/>Agency Five Management (Pty) Ltd<br/>172 Endwell Street, Winchester Hills, Johannesburg
    </div>
  </div>;
}

function App(){
  const [artist,setArtist]=useState(null);
  const [tab,setTab]=useState('home');
  const [splitPrefill,setSplitPrefill]=useState(null);
  const [restoring,setRestoring]=useState(true);

  useEffect(()=>{
    SUPA.auth.getSession().then(async({data:{session}})=>{
      if(session){
        try{
          const {data:pu}=await SUPA.from('artist_portal_users').select('artist_id').eq('user_id',session.user.id).single();
          if(pu){const a=await fetchArtistFromSupabase(pu.artist_id);setArtist(a);}
        }catch(e){}
      }
      setRestoring(false);
    });
  },[]);

  if(restoring) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:T.bg,color:T.sub,fontSize:13}}>Loading…</div>;
  if(!artist) return <LoginScreen onLogin={a=>{setArtist(a);setTab('home');}}/>;

  function startSplitSheet(title){
    setSplitPrefill(title||'');
    setTab('splits');
  }

  const titles={home:'',cmo:'CMO Status',tracks:'My Catalogue',splits:'Split Sheets',money:'Financials',actions:'Actions',compass:'Contract Compass',messages:'Messages',profile:'Settings'};
  const screens={
    home:<HomeScreen artist={artist} setTab={setTab}/>,
    cmo:<CmoScreen artist={artist}/>,
    tracks:<TracksScreen artist={artist} onCreateSplit={startSplitSheet}/>,
    splits:<SplitSheetsScreen artist={artist} setArtist={setArtist} prefillTitle={splitPrefill} clearPrefill={()=>setSplitPrefill(null)}/>,
    money:<MoneyScreen artist={artist}/>,
    actions:<ActionsScreen artist={artist}/>,
    compass:<CompassScreen artist={artist}/>,
    messages:<MessagesScreen artist={artist}/>,
    profile:<ProfileScreen artist={artist} onLogout={async()=>{if(artist._fromSupabase)await SUPA.auth.signOut();setArtist(null);setTab('home');}}/>,
  };

  return <div style={{background:T.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',position:'relative',overflowX:'hidden'}}>
    {tab!=='home'&&tab!=='messages'&&<div style={{padding:'14px 16px 12px',borderBottom:`1px solid ${T.bdr}`,display:'flex',alignItems:'center',justifyContent:'space-between',background:T.surf,position:'sticky',top:0,zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:26,height:26,borderRadius:7,background:`linear-gradient(135deg,${T.accent},${T.accentD})`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:12}}>★</div>
        <span style={{fontSize:14,fontWeight:600,color:T.text}}>{titles[tab]}</span>
      </div>
      <div onClick={()=>setTab('profile')} style={{cursor:'pointer'}}><Av initials={artist.initials} color={artist.color} size={32}/></div>
    </div>}
    {tab==='home'&&<div style={{padding:'14px 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',background:T.bg,position:'sticky',top:0,zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:28,height:28,borderRadius:8,background:`linear-gradient(135deg,${T.accent},${T.accentD})`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13}}>★</div>
        <div><div style={{fontSize:12,fontWeight:600,color:T.text}}>Soundclaim</div><div style={{fontSize:9,color:T.sub,letterSpacing:'0.1em',textTransform:'uppercase'}}>Artist Portal</div></div>
      </div>
      <div onClick={()=>setTab('profile')} style={{cursor:'pointer'}}><Av initials={artist.initials} color={artist.color} size={32}/></div>
    </div>}
    <div className="fade-up">{screens[tab]||screens.home}</div>
    <BottomNav tab={tab} setTab={setTab} redCount={artist.actions.filter(a=>a.urgency==='red').length}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
